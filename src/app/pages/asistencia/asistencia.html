<div class="min-h-[calc(100vh-5rem)] bg-[#0f172a] flex flex-col items-center justify-center p-4">
    
    <!-- Tarjeta Central del Checador -->
    <div class="bg-[#1e293b] w-full max-w-2xl rounded-3xl shadow-2xl border border-[#334155] overflow-hidden flex flex-col animate-fade-in">
        
        <!-- Header: Reloj Digital -->
        <div class="bg-[#0f172a] p-8 border-b border-[#334155] text-center flex flex-col items-center gap-2">
            <mat-icon class="text-blue-500 scale-150 mb-4">access_time</mat-icon>
            
            <!-- Hora (Grande) -->
            <h1 class="text-6xl md:text-7xl font-black text-white font-mono tracking-tight drop-shadow-lg">
                {{ horaActual() }}
            </h1>
            
            <!-- Fecha (Pequeña) -->
            <p class="text-xl text-gray-400 font-bold uppercase tracking-widest mt-2">
                {{ fechaActual() }}
            </p>
        </div>

        <!-- Body: Input del Escáner -->
        <div class="p-10 flex flex-col items-center">
            
            <p class="text-gray-400 text-lg font-medium text-center mb-6">
                Escanea tu gafete de empleado o ingresa tu código
            </p>

            <form [formGroup]="checadorForm" (ngSubmit)="registrarChecada()" class="w-full max-w-md">
                
                <div class="relative w-full">
                    <!-- Icono decorativo dentro del input -->
                    <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                        <mat-icon class="text-gray-500 scale-125">qr_code_scanner</mat-icon>
                    </div>

                    <!-- El input gigante para el escáner -->
                    <!-- El (keyup.enter) no es estrictamente necesario aquí si usamos ngSubmit en el form, 
                         pero garantiza que el "Enter" del lector dispare la función -->
                    <input type="text" 
                           id="codigoInput"
                           formControlName="codigo"
                           autofocus
                           autocomplete="off"
                           placeholder="Esperando lectura..."
                           class="w-full bg-[#0f172a] border-2 border-[#334155] focus:border-blue-500 rounded-2xl py-6 pl-16 pr-6 text-2xl font-bold text-center text-white placeholder-gray-600 outline-none transition-all shadow-inner focus:shadow-blue-500/20"
                           [disabled]="procesando()">
                </div>
            </form>

            <!-- Spinner de carga por si el servidor tarda -->
            <div class="h-8 mt-6">
                @if (procesando()) {
                    <div class="flex items-center gap-2 text-blue-400 font-bold animate-pulse">
                        <mat-icon class="animate-spin">refresh</mat-icon> Registrando...
                    </div>
                }
            </div>

        </div>

        <!-- Footer Informativo -->
        <div class="bg-gray-800/50 p-4 border-t border-[#334155] flex justify-center gap-6 text-sm text-gray-500 font-medium">
            <span class="flex items-center gap-1"><mat-icon class="text-[18px]">login</mat-icon> 1. Entrada</span>
            <span class="flex items-center gap-1"><mat-icon class="text-[18px]">restaurant</mat-icon> 2. Comida</span>
            <span class="flex items-center gap-1"><mat-icon class="text-[18px]">logout</mat-icon> 4. Salida Final</span>
        </div>
    </div>
</div>
